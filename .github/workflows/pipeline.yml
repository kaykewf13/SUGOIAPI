name: SUGOIAPI — Daily Pipeline

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      PUTIO_TOKEN: ${{ secrets.PUTIO_TOKEN }}

    steps:

      - name: Checkout SUGOIAPI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests cloudscraper

      # ── Fase A — Nyaa → Put.io ────────────────────────────────
      - name: Enqueue magnets do Nyaa no Put.io
        run: python enqueue_putio.py
        timeout-minutes: 15
        continue-on-error: true

      # ── Fase B — Harvest URLs prontas ──────────────────────────
      - name: Harvest stream URLs do Put.io
        run: python harvest_putio.py
        timeout-minutes: 10
        continue-on-error: true

      - name: Put.io summary
        run: |
          if [ -f sources/putio_entries.m3u ]; then
            TOTAL=$(grep -c "^#EXTINF" sources/putio_entries.m3u || true)
            echo "✅ putio_entries.m3u — $TOTAL entradas prontas"
          else
            echo "⚠️  putio_entries.m3u ainda não gerado"
          fi

      # ── Pipeline Python — classifica e gera M3U final ─────────
      - name: Run pipeline.py
        run: python pipeline.py
        timeout-minutes: 30
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Pipeline summary
        run: |
          if [ -f output/playlist_validada.m3u ]; then
            TOTAL=$(grep -c "^#EXTINF" output/playlist_validada.m3u || true)
            echo "✅ playlist_validada.m3u — $TOTAL entradas"
            echo ""
            echo "Breakdown por grupo:"
            grep "group-title=" output/playlist_validada.m3u | \
              grep -oP 'group-title="\K[^"]+' | \
              cut -d'|' -f1 | sort | uniq -c | sort -rn | head -20
          else
            echo "❌ playlist_validada.m3u não gerado"
            exit 1
          fi

      # ── Commit e push ──────────────────────────────────────────
      - name: Commit and push output
        run: |
          git config user.name  "SUGOIAPI Bot"
          git config user.email "bot@sugoiapi"
          git add output/playlist_validada.m3u
          [ -f sources/putio_state.json ]  && git add sources/putio_state.json
          [ -f sources/putio_entries.m3u ] && git add sources/putio_entries.m3u
          if git diff --staged --quiet; then
            echo "Sem mudanças"
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            TOTAL=$(grep -c "^#EXTINF" output/playlist_validada.m3u || echo 0)
            git commit -m "playlist: $TOTAL entradas — $TIMESTAMP"
            git push
            echo "✅ Output publicado"
          fi

name: SUGOIAPI — Daily Pipeline

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:

      # ── 1. Checkout ─────────────────────────────────────────────
      - name: Checkout SUGOIAPI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Setup Python ─────────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Instala dependências ──────────────────────────────────
      - name: Install dependencies
        run: pip install requests cloudscraper

      # ── 4. Scraper Central Animes ────────────────────────────────
      - name: Run central_animes_scraper.py
        run: python central_animes_scraper.py
        timeout-minutes: 150
        continue-on-error: true   # pipeline continua mesmo se falhar

      - name: Central Animes summary
        run: |
          if [ -f sources/central_animes.m3u ]; then
            TOTAL=$(grep -c "^#EXTINF" sources/central_animes.m3u || true)
            echo "✅ central_animes.m3u — $TOTAL entradas"
          else
            echo "⚠️  central_animes.m3u não gerado — seguindo com fontes externas"
          fi

      # ── 5. Setup Go ─────────────────────────────────────────────
      - name: Setup Go 1.21
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      # ── 6. GoAnime scraper (AnimeFire) ───────────────────────────
      - name: Go mod tidy + download
        run: |
          go mod tidy
          go mod download

      - name: Run goanime_scraper.go (AnimeFire)
        run: go run goanime_scraper.go
        timeout-minutes: 120
        continue-on-error: true
        env:
          GOANIME_LOG_LEVEL: warn

      - name: AnimeFire summary
        run: |
          if [ -f sources/anime_fire.m3u ]; then
            TOTAL=$(grep -c "^#EXTINF" sources/anime_fire.m3u || true)
            echo "✅ anime_fire.m3u — $TOTAL entradas"
          else
            echo "⚠️  anime_fire.m3u não gerado"
          fi

      # ── 7. Pipeline Python — classifica e gera M3U final ─────────
      - name: Run pipeline.py
        run: python pipeline.py
        timeout-minutes: 45
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Pipeline summary
        run: |
          if [ -f output/playlist_validada.m3u ]; then
            TOTAL=$(grep -c "^#EXTINF" output/playlist_validada.m3u || true)
            echo "✅ playlist_validada.m3u — $TOTAL entradas"
            echo ""
            echo "Breakdown por grupo:"
            grep "group-title=" output/playlist_validada.m3u | \
              grep -oP 'group-title="\K[^"]+' | \
              cut -d'|' -f1 | sort | uniq -c | sort -rn | head -20
          else
            echo "❌ playlist_validada.m3u não gerado"
            exit 1
          fi

      # ── 8. Commit e push ─────────────────────────────────────────
      - name: Commit and push output
        run: |
          git config user.name  "SUGOIAPI Bot"
          git config user.email "bot@sugoiapi"
          git add output/playlist_validada.m3u
          [ -f sources/central_animes.m3u ] && git add sources/central_animes.m3u
          [ -f sources/anime_fire.m3u ]     && git add sources/anime_fire.m3u
          if git diff --staged --quiet; then
            echo "Sem mudanças"
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            TOTAL=$(grep -c "^#EXTINF" output/playlist_validada.m3u || echo 0)
            git commit -m "playlist: $TOTAL entradas — $TIMESTAMP"
            git push
            echo "✅ Output publicado"
          fi

name: SUGOIAPI Daily Pipeline

on:
  schedule:
    - cron: '0 3 * * *'        # Diariamente as 03:00 UTC (00:00 BRT)
  workflow_dispatch:            # Permite execucao manual

concurrency:
  group: sugoiapi-pipeline
  cancel-in-progress: false     # Espera run atual terminar antes de iniciar novo

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ============================================================
      # FASE A: Nyaa -> Put.io
      # ============================================================
      - name: Enqueue Put.io (Nyaa -> Put.io)
        env:
          PUTIO_TOKEN: ${{ secrets.PUTIO_TOKEN }}
        run: |
          if [ -n "$PUTIO_TOKEN" ]; then
            python enqueue_putio.py || echo "WARN enqueue_putio falhou - continuando"
          else
            echo "WARN PUTIO_TOKEN nao configurado - pulando enqueue"
          fi

      # ============================================================
      # FASE B: Put.io -> URLs prontas
      # ============================================================
      - name: Harvest Put.io (Put.io -> URLs)
        env:
          PUTIO_TOKEN: ${{ secrets.PUTIO_TOKEN }}
        run: |
          if [ -n "$PUTIO_TOKEN" ]; then
            python harvest_putio.py || echo "WARN harvest_putio falhou - continuando"
          else
            echo "WARN PUTIO_TOKEN nao configurado - pulando harvest"
          fi

      - name: Verificar putio_entries.m3u
        run: |
          if [ -f sources/putio_entries.m3u ]; then
            TOTAL=$(grep -c "^#EXTINF" sources/putio_entries.m3u || true)
            echo "OK putio_entries.m3u - $TOTAL entradas prontas"
          else
            echo "WARN putio_entries.m3u ainda nao gerado"
          fi

      # ============================================================
      # FASE C: Pipeline principal
      # ============================================================
      - name: Executar pipeline principal
        run: python pipeline.py

      - name: Verificar output
        run: |
          if [ -f output/playlist_validada.m3u ]; then
            TOTAL=$(grep -c "^#EXTINF" output/playlist_validada.m3u || true)
            echo "OK playlist_validada.m3u - $TOTAL entradas"
            echo ""
            echo "Breakdown por grupo:"
            grep "group-title=" output/playlist_validada.m3u | \
              grep -oP 'group-title="\K[^"]+' | \
              cut -d'|' -f1 | sort | uniq -c | sort -rn | head -20
          else
            echo "FAIL playlist_validada.m3u nao gerado"
            exit 1
          fi
     # ============================================================
        - name: Proteger token do Put.io
          run: python sanitize_putio.py output/playlist_validada.m3u

      # ============================================================
      # FASE D: Commit e push com retry
      # ============================================================
      - name: Commit e push (com retry)
        run: |
          git config user.name  "SUGOIAPI Bot"
          git config user.email "bot@sugoiapi"

          git add output/playlist_validada.m3u
          [ -f sources/putio_state.json ]  && git add sources/putio_state.json
          [ -f sources/putio_entries.m3u ] && git add sources/putio_entries.m3u

          if git diff --staged --quiet; then
            echo "Sem mudancas para commitar"
            exit 0
          fi

          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          TOTAL=$(grep -c "^#EXTINF" output/playlist_validada.m3u || echo 0)
          git commit -m "playlist: $TOTAL entradas - $TIMESTAMP"

          # Retry com rebase em caso de conflito de push concorrente
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            if git push origin main; then
              echo "OK Output publicado (tentativa $i)"
              exit 0
            fi

            echo "WARN Push falhou na tentativa $i/$MAX_RETRIES - rebase e re-tentando..."
            git pull --rebase origin main || {
              echo "FAIL Rebase falhou - abortando"
              git rebase --abort 2>/dev/null
              exit 1
            }

            # Backoff exponencial: 2s, 4s, 8s, 16s, 32s
            SLEEP=$((2 ** i))
            sleep $SLEEP
          done

          echo "FAIL Falhou apos $MAX_RETRIES tentativas"
          exit 1
